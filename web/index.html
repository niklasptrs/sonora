<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101116"><title>Sonora · Mikrofon-Studio</title><link rel="stylesheet" href="studio.css"><script src="studio.js" defer></script></head><body>
<header><div class="brand"><i class="mark" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b></i>sonora</div><span class="division">Mikrofon-Studio</span><button id="mic">Mikrofon starten</button></header>
<main><section class="stage" aria-label="Visualizer"><canvas id="screen" aria-hidden="true"></canvas><div class="stageTop"><span id="mode" role="status">Vorschau</span><button id="expand" aria-pressed="false">Großansicht</button></div><div class="stageBottom"><div><small>VISUALIZER</small><h1 id="title">Orbit</h1></div><div class="level"><small>EINGANGSPEGEL</small><meter id="level" min="0" max="1" value="0" aria-label="Mikrofonpegel"></meter></div></div></section>
<aside><h2>Studio</h2><fieldset><legend>Darstellung</legend><div id="styles"></div></fieldset>
<fieldset><legend>Farbwelt</legend><div id="colors"></div><span id="colorName"></span></fieldset>
<fieldset><legend>Reaktion</legend><label for="gain">Empfindlichkeit <output id="gainOut"></output></label><input type="range" id="gain" min="0.5" max="3" step="0.1" value="1.4"><label for="smooth">Nachklang <output id="smoothOut"></output></label><input type="range" id="smooth" min="0" max="0.9" step="0.05" value="0.65"></fieldset>
<p id="help" role="status">Starte das Mikrofon, damit die Grafik auf Musik im Raum reagiert. Das Audio bleibt auf deinem Gerät.</p></aside></main></body></html>
